[package]
name = "typio-core"
version = "3.2.7"
edition = "2021"
authors = ["Typio Contributors"]
license = "MIT"

[lib]
name = "typio_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
libc = "0.2"
lazy_static = "1.5"

[profile.release]
opt-level = 3
lto = true

[build-dependencies]
cbindgen = "0.29.2"
