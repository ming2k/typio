[package]
name = "typio-core"
version = "4.1.0"
edition = "2021"
authors = ["Typio Contributors"]
license = "MIT"

[lib]
name = "typio_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
libc = "0.2"
lazy_static = "1.5"

[profile.release]
opt-level = 3
lto = "thin"

[features]
default = []
build_basic_engine = []
